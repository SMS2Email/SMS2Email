syntax = "proto3";

option java_package = "io.github.sms2email.sms2email";
option java_multiple_files = true;
option java_outer_classname = "PreferencesProto";

enum SmtpEncryptionMode {
  SMTP_ENCRYPTION_MODE_STARTTLS = 0;
  SMTP_ENCRYPTION_MODE_SMTPS = 1;
  SMTP_ENCRYPTION_MODE_NONE = 2;
}

message Preferences {
  bool inputs_selected = 1;
  repeated InputPreference inputs = 2;
  repeated EmailPreference emails = 3;
  repeated MatrixPreference matrices = 4;
}

message InputPreference {
  string id = 1;
  int32 slot_index = 2;
  int32 subscription_id = 3;
  string label = 4;
  bool enabled = 5;
}

message EmailPreference {
  string id = 1;
  string label = 2;
  bool enabled = 3;
  string email_to = 4;
  string smtp_host = 5;
  int32 smtp_port = 6;
  string smtp_user = 7;
  string smtp_token = 8;
  string from_email = 9;
  SmtpEncryptionMode encryption_mode = 10;
}

message MatrixPreference {
  string id = 1;
  string label = 2;
  bool enabled = 3;
  string homeserver = 4;
  string user = 5;
  string access_token = 6;
  string room_id = 7;
  string device_id = 8;
}
