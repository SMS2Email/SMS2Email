syntax = "proto3";

option java_package = "io.github.sms2email.sms2email";
option java_multiple_files = true;
option java_outer_classname = "PreferencesProto";

enum SmtpEncryptionMode {
  SMTP_ENCRYPTION_MODE_STARTTLS = 0;
  SMTP_ENCRYPTION_MODE_SMTPS = 1;
  SMTP_ENCRYPTION_MODE_NONE = 2;
}

enum PgpMode {
  PGP_MODE_OFF = 0;
  // Sign with this phone's key and encrypt to the recipient, both through OpenKeychain.
  PGP_MODE_OPENKEYCHAIN = 1;
}

message Preferences {
  repeated EmailPreference emails = 3;
  repeated MatrixPreference matrices = 4;
}

message InputPreference {
  string id = 1;
  int32 slot_index = 2;
  int32 subscription_id = 3;
  string label = 4;
  bool enabled = 5;
}

message EmailPreference {
  string id = 1;
  bool enabled = 3;
  string email_to = 4;
  string smtp_host = 5;
  int32 smtp_port = 6;
  string smtp_user = 7;
  string smtp_password = 8;
  string from_email = 9;
  SmtpEncryptionMode encryption_mode = 10;
  repeated InputPreference inputs = 11;
  PgpMode pgp_mode = 12;
  // Recipient key IDs chosen in OpenKeychain.
  repeated int64 pgp_key_ids = 13;
  // This phone's signing key ID chosen in OpenKeychain.
  int64 pgp_sign_key_id = 14;
}

message MatrixPreference {
  string id = 1;
  bool enabled = 3;
  string homeserver = 4;
  string user = 5;
  string access_token = 6;
  string room_id = 7;
  string device_id = 8;
  repeated InputPreference inputs = 9;
}
